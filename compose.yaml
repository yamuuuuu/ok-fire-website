services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: okfire
      POSTGRES_USER: okfire
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - okfire_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okfire -d okfire"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  okfire_postgres:
